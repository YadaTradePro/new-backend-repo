services:
  # TGJU Proxy Service (سبک و کم‌مصرف)
  tgju_proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: tgju-proxy
    command: python services/tgju.py
    volumes:
      - .:/app
    ports:
      - "5001:5001"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: gunicorn --workers 4 --worker-class gevent --bind 0.0.0.0:5000 --timeout 300 "main:create_app()"
    ports:
      - "5000:5000"
    volumes:
      - .:/app   # تمام سورس‌کد + extensions.py و غیره داخل کانتینر دیده میشه
      - ./models:/app/models  # ML models روی volume جدا
    depends_on:
      - tgju_proxy
    restart: always
    deploy:
      resources:
        limits:
          memory: 8G

  # Scheduler Service
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    command: python scheduler.py
    volumes:
      - .:/app   # سورس اصلی دیده بشه → مشکل import حل میشه
      - ./models:/app/models
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
